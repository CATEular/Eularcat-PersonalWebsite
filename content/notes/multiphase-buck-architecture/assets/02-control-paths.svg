raft-rectangle" points="400,330 700,330 700,420 400,420" fill="#eaf2f6" stroke="#167e78" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d20" data-kind="draft-rectangle" points="780,330 1220,330 1220,420 780,420" fill="#eaf2f6" stroke="#167e78" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d23" data-kind="draft-rectangle" points="20,500 320,500 320,590 20,590" fill="#eaf2f6" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d26" data-kind="draft-rectangle" points="400,500 700,500 700,590 400,590" fill="#eaf2f6" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d29" data-kind="draft-rectangle" points="780,500 1220,500 1220,590 780,590" fill="#eaf2f6" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/></g><g data-layer="routes"/><g data-layer="junctions"/><g data-layer="symbols"/><g data-layer="annotations"/><g data-layer="drafting" data-drafting-layer="foreground"><text data-object-id="d1" data-kind="draft-text" x="0" y="0" text-anchor="start" font-size="27.2088" font-weight="bold" font-style="normal" fill="#193747">02  调压、逐周期 PWM、均流：各管一件事</text><text data-object-id="d2" data-kind="draft-text" x="0" y="42" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#566875">Roh 2015 架构的职责图 · 各相共享 VERR，slave 由 CBC 调人工斜坡</text><polyline points="0,70 1280,70" fill="none" data-object-id="d3" data-kind="construction-line" stroke="#566875" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><text data-object-id="d4" data-kind="draft-text" x="0" y="118" text-anchor="start" font-size="17.383399999999998" font-weight="bold" font-style="normal" fill="#2368a0">路径 A · 输出电压环</text><text data-object-id="d6" data-kind="draft-text" x="170" y="193" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#2368a0">VO 与 VREF 比较<tspan data-text-run="line-break" x="170" dy="18.1392">误差放大器</tspan></text><g data-object-id="d7" data-kind="draft-arrow"><polyline points="320,205 383.430233,205" fill="none" stroke="#2368a0" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="400,205 383.430233,208.9534885 383.430233,201.0465115" fill="#2368a0"/></g><text data-object-id="d9" data-kind="draft-text" x="550" y="205" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#2368a0">公共需求 VERR</text><g data-object-id="d10" data-kind="draft-arrow"><polyline points="700,205 763.430233,205" fill="none" stroke="#2368a0" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="780,205 763.430233,208.9534885 763.430233,201.0465115" fill="#2368a0"/></g><text data-object-id="d12" data-kind="draft-text" x="1000" y="205" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#2368a0">送给各相 PWM 比较器</text><text data-object-id="d13" data-kind="draft-text" x="0" y="294" text-anchor="start" font-size="17.383399999999998" font-weight="bold" font-style="normal" fill="#167e78">路径 B · 每个开关周期</text><text data-object-id="d15" data-kind="draft-text" x="170" y="363" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#167e78">各相 ICS<tspan data-text-run="line-break" x="170" dy="18.1392">瞬时电流 ISL</tspan></text><g data-object-id="d16" data-kind="draft-arrow"><polyline points="320,375 383.430233,375" fill="none" stroke="#167e78" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="400,375 383.430233,378.9534885 383.430233,371.0465115" fill="#167e78"/></g><text data-object-id="d18" data-kind="draft-text" x="550" y="363" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#167e78">ISL + 人工斜坡 IAR<tspan data-text-run="line-break" x="550" dy="18.1392">形成 VPWM</tspan></text><g data-object-id="d19" data-kind="draft-arrow"><polyline points="700,375 763.430233,375" fill="none" stroke="#167e78" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="780,375 763.430233,378.9534885 763.430233,371.0465115" fill="#167e78"/></g><text data-object-id="d21" data-kind="draft-text" x="1000" y="363" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#167e78">VPWM 与 VERR 比较<tspan data-text-run="line-break" x="1000" dy="18.1392">决定本周期关断时刻</tspan></text><text data-object-id="d22" data-kind="draft-text" x="0" y="464" text-anchor="start" font-size="17.383399999999998" font-weight="bold" font-style="normal" fill="#ba632c">路径 C · 相与相的平均差</text><text data-object-id="d24" data-kind="draft-text" x="170" y="533" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#ba632c">各相 ACS<tspan data-text-run="line-break" x="170" dy="18.1392">平均电流对应量 VAL</tspan></text><g data-object-id="d25" data-kind="draft-arrow"><polyline points="320,545 383.430233,545" fill="none" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="400,545 383.430233,548.9534885 383.430233,541.0465115" fill="#ba632c"/></g><text data-object-id="d27" data-kind="draft-text" x="550" y="533" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#ba632c">slave 与 master 比较<tspan data-text-run="line-break" x="550" dy="18.1392">CBC 积分差值</tspan></text><g data-object-id="d28" data-kind="draft-arrow"><polyline points="700,545 763.430233,545" fill="none" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="780,545 763.430233,548.9534885 763.430233,541.0465115" fill="#ba632c"/></g><text data-object-id="d30" data-kind="draft-text" x="1000" y="533" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#ba632c">修正 slave 人工斜坡<tspan data-text-run="line-break" x="1000" dy="18.1392">最终修正占空比与相电流</tspan></text><text data-object-id="d31" data-kind="draft-text" x="0" y="642" text-anchor="start" font-size="15.116" font-weight="bold" font-style="normal" fill="#193747">时钟：安排四相启动的时间间隔；时钟等间隔，本身不会消除器件失配造成的电流差。</text><text data-object-id="d32" data-kind="draft-text" x="0" y="686" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#566875">切相 PSC：读取各相 IAL 的平均总和，并结合 VIN 相关阈值，决定启用多少相。</text><polyline points="0,720 1280,720" fill="none" data-object-id="d33" data-kind="construction-line" stroke="#566875" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><text data-object-id="d34" data-kind="draft-text" x="0" y="753" text-anchor="start" font-size="12.54628" font-weight="normal" font-style="normal" fill="#566875">三条路径的时间尺度与作用不同：ACS 的平均量不替代 ICS 的快速量；切相也不等于均流。</text><text data-object-id="d35" data-kind="draft-text" x="0" y="786" text-anchor="start" font-size="12.0928" font-weight="normal" font-style="normal" fill="#566875">依据 Roh et al., IEEE TPEL 2015 · DOI 10.1109/TPEL.2014.2368130 · 教学重绘</text></g></g></svg>