ta-kind="draft-rectangle" points="860,230 1300,230 1300,310 860,310" fill="#eaf2f6" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d19" data-kind="draft-rectangle" points="20,407.5 360,407.5 360,492.5 20,492.5" fill="#eaf2f6" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d22" data-kind="draft-rectangle" points="455,407.5 825,407.5 825,492.5 455,492.5" fill="#eaf2f6" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d25" data-kind="draft-rectangle" points="920,407.5 1290,407.5 1290,492.5 920,492.5" fill="#eaf2f6" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d28" data-kind="draft-rectangle" points="920,557.5 1290,557.5 1290,642.5 920,642.5" fill="#eaf2f6" stroke="#167e78" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d31" data-kind="draft-rectangle" points="455,557.5 825,557.5 825,642.5 455,642.5" fill="#eaf2f6" stroke="#167e78" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d34" data-kind="draft-rectangle" points="20,557.5 360,557.5 360,642.5 20,642.5" fill="#eaf2f6" stroke="#167e78" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/></g><g data-layer="routes"/><g data-layer="junctions"/><g data-layer="symbols"/><g data-layer="annotations"/><g data-layer="drafting" data-drafting-layer="foreground"><text data-object-id="d1" data-kind="draft-text" x="0" y="0" text-anchor="start" font-size="27.2088" font-weight="bold" font-style="normal" fill="#193747">03  双检测通路：快的管 PWM，平均的管均流</text><text data-object-id="d2" data-kind="draft-text" x="0" y="42" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#566875">论文原理的教学重绘 · 未复刻晶体管级原图 · 以下以 slave 电流偏小为例</text><polyline points="0,70 1280,70" fill="none" data-object-id="d3" data-kind="construction-line" stroke="#566875" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><text data-object-id="d5" data-kind="draft-text" x="130" y="210" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#2368a0">相电感电流 iL</text><g data-object-id="d6" data-kind="draft-arrow"><polyline points="250,190 290,190 290,140 323.430233,140" fill="none" stroke="#167e78" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="340,140 323.430233,143.9534885 323.430233,136.0465115" fill="#167e78"/></g><text data-object-id="d8" data-kind="draft-text" x="570" y="128" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#167e78">ICS：高侧 pMOS 导通时<tspan data-text-run="line-break" x="570" dy="19.49964">SenseFET 复制功率管电流</tspan></text><g data-object-id="d9" data-kind="draft-arrow"><polyline points="800,140 843.430233,140" fill="none" stroke="#167e78" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="860,140 843.430233,143.9534885 843.430233,136.0465115" fill="#167e78"/></g><text data-object-id="d11" data-kind="draft-text" x="1080" y="128" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#167e78">瞬时 ISL → PWM<tspan data-text-run="line-break" x="1080" dy="18.1392">高侧关断时该输出归零</tspan></text><g data-object-id="d12" data-kind="draft-arrow"><polyline points="250,230 290,230 290,270 323.430233,270" fill="none" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="340,270 323.430233,273.9534885 323.430233,266.0465115" fill="#ba632c"/></g><text data-object-id="d14" data-kind="draft-text" x="570" y="258" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#ba632c">ACS：电感 DCR + RC 取平均<tspan data-text-run="line-break" x="570" dy="18.1392">VAL ∝ RDCR ·〈IL〉</tspan></text><g data-object-id="d15" data-kind="draft-arrow"><polyline points="800,270 843.430233,270" fill="none" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="860,270 843.430233,273.9534885 843.430233,266.0465115" fill="#ba632c"/></g><text data-object-id="d17" data-kind="draft-text" x="1080" y="258" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#ba632c">平均 VAL → CBC 均流<tspan data-text-run="line-break" x="1080" dy="18.1392">IAL 总平均 → PSC 切相</tspan></text><text data-object-id="d18" data-kind="draft-text" x="0" y="363" text-anchor="start" font-size="16.929920000000003" font-weight="bold" font-style="normal" fill="#193747">负反馈链：差值推动修正，直到 slave 追上 master</text><text data-object-id="d20" data-kind="draft-text" x="190" y="438" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#ba632c">① slave 平均电流偏小<tspan data-text-run="line-break" x="190" dy="15.72064">VAL,S &lt; VAL,M</tspan></text><g data-object-id="d21" data-kind="draft-arrow"><polyline points="360,450 438.430233,450" fill="none" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="455,450 438.430233,453.9534885 438.430233,446.0465115" fill="#ba632c"/></g><text data-object-id="d23" data-kind="draft-text" x="640" y="438" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#ba632c">② CBC 积分平均差值<tspan data-text-run="line-break" x="640" dy="18.1392">ICB,S 增大</tspan></text><g data-object-id="d24" data-kind="draft-arrow"><polyline points="825,450 903.430233,450" fill="none" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="920,450 903.430233,453.9534885 903.430233,446.0465115" fill="#ba632c"/></g><text data-object-id="d26" data-kind="draft-text" x="1105" y="438" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#ba632c">③ ARCG 的 CR 充电变慢<tspan data-text-run="line-break" x="1105" dy="18.1392">IREF2 − ICB,S 减小</tspan></text><g data-object-id="d27" data-kind="draft-arrow"><polyline points="1105,493 1105,538.430233" fill="none" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="1105,555 1101.0465115,538.430233 1108.9534885,538.430233" fill="#ba632c"/></g><text data-object-id="d29" data-kind="draft-text" x="1105" y="588" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#167e78">④ 人工斜坡 IAR 更缓<tspan data-text-run="line-break" x="1105" dy="18.1392">VPWM 到达 VERR 更晚</tspan></text><g data-object-id="d30" data-kind="draft-arrow"><polyline points="920,600 841.569767,600" fill="none" stroke="#167e78" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="825,600 841.569767,596.0465115 841.569767,603.9534885" fill="#167e78"/></g><text data-object-id="d32" data-kind="draft-text" x="640" y="588" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#167e78">⑤ 同 VERR 与周期下<tspan data-text-run="line-break" x="640" dy="18.1392">关断变晚，占空比 D 增大</tspan></text><g data-object-id="d33" data-kind="draft-arrow"><polyline points="455,600 376.569767,600" fill="none" stroke="#167e78" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="360,600 376.569767,596.0465115 376.569767,603.9534885" fill="#167e78"/></g><text data-object-id="d35" data-kind="draft-text" x="190" y="588" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#167e78">⑥ 电感平均电流增加<tspan data-text-run="line-break" x="190" dy="18.1392">slave 与 master 差值缩小</tspan></text><polyline points="0,720 1280,720" fill="none" data-object-id="d36" data-kind="construction-line" stroke="#566875" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><text data-object-id="d37" data-kind="draft-text" x="0" y="753" text-anchor="start" font-size="12.54628" font-weight="normal" font-style="normal" fill="#566875">条件：正常闭环工作且调节未饱和。DCR 平均关系用于稳态/足够平均；传感增益及 DCR 失配仍会影响均流精度。</text><text data-object-id="d38" data-kind="draft-text" x="0" y="786" text-anchor="start" font-size="12.0928" font-weight="normal" font-style="normal" fill="#566875">依据 Roh et al., IEEE TPEL 2015 · DOI 10.1109/TPEL.2014.2368130 · 教学重绘</text></g></g></svg>