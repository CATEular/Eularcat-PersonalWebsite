<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.2 -25.33333396911621 1300.4 816.0000419616699" role="img" aria-labelledby="title" data-style-profile="razavi-textbook-v1"><title id="title">New Circuit</title><rect x="-5.2" y="-25.33333396911621" width="1300.4" height="816.0000419616699" fill="#fff"/><style>@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:400;font-style:normal;font-display:block;unicode-range:U+002E}@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:400;font-style:italic;font-display:block;unicode-range:U+002E}@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:700;font-style:normal;font-display:block;unicode-range:U+002E}@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:700;font-style:italic;font-display:block;unicode-range:U+002E}svg{font-size:15.116px;fill:#000}text{font-family:'ICM Round Period','Metropolis','DejaVu Sans',Arial,'Helvetica Neue',Helvetica,sans-serif}</style><g data-layer="formal"><g data-layer="drafting" data-drafting-layer="background"><polygon data-object-id="d4" data-kind="draft-rectangle" points="20,120 600,120 600,250 20,250" fill="#eaf2f6" stroke="#ba632c" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d6" data-kind="draft-rectangle" points="680,120 1260,120 1260,250 680,250" fill="#eaf2f6" stroke="#167e78" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d14" data-kind="draft-rectangle" points="10,465 430,465 430,555 10,555" fill="#eaf2f6" stroke="#2368a0" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d17" data-kind="draft-rectangle" points="500,465 980,465 980,555 500,555" fill="#eaf2f6" stroke="#2368a0" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="d20" data-kind="draft-rectangle" points="1050,465 1290,465 1290,555 1050,555" fill="#eaf2f6" stroke="#2368a0" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/></g><g data-layer="routes"/><g data-layer="junctions"/><g data-layer="symbols"/><g data-layer="annotations"/><g data-layer="drafting" data-drafting-layer="foreground"><text data-object-id="d1" data-kind="draft-text" x="0" y="0" text-anchor="start" font-size="27.2088" font-weight="bold" font-style="normal" fill="#193747">04  轻载减相、重载加相：寻找较小的总损耗</text><text data-object-id="d2" data-kind="draft-text" x="0" y="42" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#566875">相数 N 取 1 至 4 · PSC 根据平均负载与输入条件切换 · 这里不给普适电流阈值</text><polyline points="0,70 1280,70" fill="none" data-object-id="d3" data-kind="construction-line" stroke="#566875" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><text data-object-id="d5" data-kind="draft-text" x="310" y="161" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#ba632c">轻载：IO 较小<tspan data-text-run="line-break" x="310" dy="18.1392">每多开一相，都要付开关代价</tspan><tspan data-text-run="line-break" x="310" dy="18.1392">因此较少相可能更高效</tspan></text><text data-object-id="d7" data-kind="draft-text" x="970" y="161" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#167e78">重载：IO 较大<tspan data-text-run="line-break" x="970" dy="18.1392">电流分给更多相，可减小电阻损耗</tspan><tspan data-text-run="line-break" x="970" dy="18.1392">因此较多相可能更高效</tspan></text><text data-object-id="d8" data-kind="draft-text" x="0" y="300" text-anchor="start" font-size="16.32528" font-weight="bold" font-style="normal" fill="#193747">简化估算（同规格、理想均流；忽略纹波电流项）：</text><text data-object-id="d9" data-kind="draft-text" x="80" y="350" text-anchor="start" font-size="18.1392" font-weight="bold" font-style="normal" fill="#167e78">导通损耗  Pcond ≈ IO² · Req / N</text><text data-object-id="d10" data-kind="draft-text" x="80" y="393" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#566875">Req：每相等效导通电阻；相数增加 → 此项减小</text><text data-object-id="d11" data-kind="draft-text" x="720" y="350" text-anchor="start" font-size="18.1392" font-weight="bold" font-style="normal" fill="#ba632c">开关相关损耗  Psw ≈ N · Ephase · fS</text><text data-object-id="d12" data-kind="draft-text" x="720" y="393" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#566875">每相开关能量近似固定时，开更多相代价更高</text><polyline points="0,430 1280,430" fill="none" data-object-id="d13" data-kind="construction-line" stroke="#566875" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><text data-object-id="d15" data-kind="draft-text" x="220" y="498" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#2368a0">各相 IAL 求和并取平均<tspan data-text-run="line-break" x="220" dy="18.1392">VPS ∝ 平均总负载电流</tspan></text><g data-object-id="d16" data-kind="draft-arrow"><polyline points="430,510 483.430233,510" fill="none" stroke="#2368a0" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="500,510 483.430233,513.9534885 483.430233,506.0465115" fill="#2368a0"/></g><text data-object-id="d18" data-kind="draft-text" x="740" y="498" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#2368a0">PSC 比较上下阈值<tspan data-text-run="line-break" x="740" dy="18.1392">上阈值 VRU &gt; 下阈值 VRD</tspan></text><g data-object-id="d19" data-kind="draft-arrow"><polyline points="980,510 1033.430233,510" fill="none" stroke="#2368a0" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="1050,510 1033.430233,513.9534885 1033.430233,506.0465115" fill="#2368a0"/></g><text data-object-id="d21" data-kind="draft-text" x="1170" y="498" text-anchor="middle" font-size="15.116" font-weight="bold" font-style="normal" fill="#2368a0">启用相数 N<tspan data-text-run="line-break" x="1170" dy="15.72064">1 ↔ 2 ↔ 3 ↔ 4</tspan></text><text data-object-id="d22" data-kind="draft-text" x="0" y="616" text-anchor="start" font-size="16.02296" font-weight="bold" font-style="normal" fill="#167e78">负载上升：超过上阈值 → 加一相</text><text data-object-id="d23" data-kind="draft-text" x="660" y="616" text-anchor="start" font-size="16.02296" font-weight="bold" font-style="normal" fill="#ba632c">负载下降：低于下阈值 → 减一相</text><text data-object-id="d24" data-kind="draft-text" x="0" y="669" text-anchor="start" font-size="16.02296" font-weight="normal" font-style="normal" fill="#193747">迟滞区内维持当前相数，减少来回切换；阈值随 VIN 和当前相数改变。</text><polyline points="0,720 1280,720" fill="none" data-object-id="d25" data-kind="construction-line" stroke="#566875" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><text data-object-id="d26" data-kind="draft-text" x="0" y="753" text-anchor="start" font-size="12.54628" font-weight="normal" font-style="normal" fill="#566875">这些损耗式只解释趋势；真实最优切相点还受器件、驱动、纹波与输入电压影响，需仿真或测量确定。</text><text data-object-id="d27" data-kind="draft-text" x="0" y="786" text-anchor="start" font-size="12.0928" font-weight="normal" font-style="normal" fill="#566875">依据 Roh et al., IEEE TPEL 2015 · DOI 10.1109/TPEL.2014.2368130 · 教学重绘</text></g></g></svg>